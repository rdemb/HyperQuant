# Wzorzec workflow gałęzi `health` repo danych (tam: .github/workflows/ledger-verify.yml).
# Niezależna weryfikacja dziennika na infrastrukturze GitHuba (nie na serwerze skanera): klon gałęzi ledger, weryfikator
# z repo HyperQuant (łańcuch, historia git, kolejność, pokwitowania, wyniki, ceny ze świec), znaczek shields.io
# i podsumowanie dla strony w gałęzi health. Bez sekretów (wbudowany token; jego push nie uruchamia workflow ponownie).
#
# Kiedy: przy każdym zapisie strażnika do gałęzi health (zmiana stanu, przypomnienie co 6 h, puls co 12 h przy „ok”).
# Harmonogramu (`schedule`) tu nie ma: GitHub uruchamia go tylko z gałęzi domyślnej, a `main` tego repo to publikacja
# skanera nadpisywana co 2 min. Gdy przebiegi ustaną, wynik starzeje się: po 36 h nadzór danych w repo HyperQuant
# (data-health.yml, harmonogram co 30 min) i strażnik zgłaszają problem, a pierwszy kolejny przebieg daje czerwony znaczek.
#
# Przyrostowo: historia git sprawdzana od punktu kontrolnego (verify/checkpoint.json — ostatni commit gałęzi ledger
# z udaną weryfikacją), pełna historia co najmniej raz na 7 dni (scripts/verify-status.mjs). Łańcuch hashy, wyniki
# i pokwitowania — zawsze od GENESIS.
name: Niezależna weryfikacja dziennika

on:
  push:
    branches: [health]
    paths: [alert.json]

permissions:
  contents: write

# Trwający przebieg nie jest przerywany przez kolejne zapisy strażnika; czeka najwyżej jeden następny
concurrency:
  group: ledger-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Niezależna weryfikacja dziennika
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Weryfikator (HyperQuant, main)
        uses: actions/checkout@v7
        with:
          repository: rdemb/HyperQuant
          path: hq
      - name: Gałąź ledger (pełna historia)
        uses: actions/checkout@v7
        with:
          ref: ledger
          path: ledger
          fetch-depth: 0
      - name: Gałąź health
        uses: actions/checkout@v7
        with:
          ref: health
          path: health
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Punkt kontrolny
        id: cp
        run: |
          echo "since=$(node hq/scripts/verify-status.mjs since health)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C ledger rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Weryfikacja
        id: v
        timeout-minutes: 20
        env:
          SINCE: ${{ steps.cp.outputs.since }}
        run: |
          set +e
          node hq/scripts/verify-ledger.mjs --dir ledger --market ${SINCE:+--since-commit "$SINCE"} > report.txt 2>&1
          code=$?
          cat report.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Także po przekroczeniu limitu kroku: bez kodu podsumowanie zostaje, a znaczek gaśnie, gdy wynik ma ponad 36 h
      - name: Znaczek, podsumowanie i punkt kontrolny
        if: ${{ always() && steps.cp.outcome == 'success' }}
        env:
          CODE: ${{ steps.v.outputs.code }}
          SINCE: ${{ steps.cp.outputs.since }}
          HEAD_SHA: ${{ steps.cp.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          msg=$(node hq/scripts/verify-status.mjs publish health --code "$CODE" --report report.txt --head "$HEAD_SHA" --run "$RUN_URL" ${SINCE:+--since "$SINCE"})
          cd health
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badge verify
          git diff --cached --quiet && exit 0
          git commit -q -m "weryfikacja dziennika: $msg"
          for i in 1 2 3; do git push -q origin HEAD:health && exit 0; git pull -q --rebase origin health; done
          exit 1
      # Niezgodność albo przebieg niedokończony — czerwony przebieg w Actions (widoczny w historii przebiegów)
      - name: Wynik
        if: ${{ always() }}
        env:
          CODE: ${{ steps.v.outputs.code }}
        run: test "$CODE" = "0"
