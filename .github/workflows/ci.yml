name: CI

# Kontrola każdego pull requesta: typy, testy i build — zanim cokolwiek trafi na main (i na GitHub Pages)
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typy, testy, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 — ten sam runtime co skaner na serwerze (TypeScript bez kompilacji; test natywnego ładowania)
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Zależności
        run: npm ci --legacy-peer-deps

      - name: Typy (tsc)
        run: npm run lint

      - name: Testy (vitest)
        run: npm test

      # Bundle paczki MCP i test dymny przez prawdziwe stdio (initialize + tools/list, bez sieci): czysty stdout i 10 narzędzi
      - name: Bundle MCP
        run: npm run mcp:build

      - name: Test dymny MCP (stdio)
        run: node mcp/scripts/stdio-smoke.mjs mcp/dist/hyperquant-mcp.mjs

      - name: Build
        run: npm run build

      # Stara powłoka bez kodu nowego wyglądu, rejestracja service workera w pliku wejściowym (manifest Vite)
      - name: Granice pakietu
        run: node scripts/build/granice-pakietu.mjs

  # Testy akceptacyjne interfejsu (npm run ui:check): Chrome bez okna na zbudowanej stronie, bez sieci — API Hyperliquid
  # z danych stałych (scripts/ui/fixtures.mjs), zegar strony stoi w nagranej dobie 24.10.2026, więc wynik nie zależy od
  # pory dnia ani od rynku. Przy porażce zrzuty i raport JSON jako artefakt.
  ui:
    name: Interfejs (ui:check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Zależności
        run: npm ci --legacy-peer-deps

      # Stała główna wersja Chrome (ta sama, na której zapisano punkt odniesienia): zmiana renderowania nie przychodzi sama
      - name: Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 157
          install-dependencies: true

      - name: Pomiar układu (dane stałe, bez sieci)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run ui:check -- --label ci --shots ui-check/zrzuty

      - name: Zrzuty i raport przy porażce
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-check
          path: ui-check/
          retention-days: 14
