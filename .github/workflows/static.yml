name: Deploy static content to Pages

on:
  push:
    branches:
      - main
      - master
  # Odświeżanie danych publicznych (best-effort: GitHub może opóźniać lub pomijać przebiegi z harmonogramu)
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Zgłoś do IndexNow wszystkie adresy z sitemap.xml'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Nie przerywaj trwającego wdrożenia (np. push nie może zostać anulowany przez przebieg z harmonogramu)
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite App
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.body }}
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Dane publiczne bez kluczy API → public/data/feeds/*.json (skrypt bez zależności, przed npm ci); błąd źródeł
      # nie blokuje wdrożenia po pushu
      - name: Fetch Public Data
        id: feeds
        run: node scripts/fetch-public-data.mjs
        continue-on-error: true

      # Przebieg z harmonogramu wdraża tylko nowe dane: bez zmian względem Pages albo bez żadnego pliku kończy się tutaj
      - name: Decide Deploy
        id: gate
        run: |
          if [ "$EVENT" != schedule ] || [ "$CHANGED" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dane bez zmian albo pobranie nie powiodło się: bez wdrożenia"
          fi
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.feeds.outputs.changed }}

      - name: Install Dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci --legacy-peer-deps

      - name: Type Check
        if: steps.gate.outputs.deploy == 'true'
        run: npm run lint

      - name: Run Tests
        if: steps.gate.outputs.deploy == 'true'
        run: npm test

      - name: Build Production Assets
        if: steps.gate.outputs.deploy == 'true'
        run: npm run build
        env:
          # Publiczny adres danych skanera (repo rdemb/hyperquant-data) — zmienna repozytorium, pusta = panel mapy likwidacji czeka
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}

      # Nowe i zmienione wpisy bloga z tego pusha (diff względem poprzedniej głowy main; lista plików w commitach zdarzenia
      # push jest pusta) albo ręcznie cała mapa strony → zgłoszenie IndexNow po wdrożeniu (pusto = nic do zgłoszenia)
      - name: List New Blog Posts For IndexNow
        id: indexnow
        if: github.event_name == 'push' || inputs.indexnow_all
        continue-on-error: true
        run: |
          if [ "$ALL" = true ]; then
            node scripts/blog/indexnow.mjs --all >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BEFORE"
            git diff --name-only --diff-filter=AM "$BEFORE" HEAD | node scripts/blog/indexnow.mjs >> "$GITHUB_OUTPUT"
          fi
        env:
          ALL: ${{ inputs.indexnow_all }}
          BEFORE: ${{ github.event.before }}

      - name: Upload GitHub Pages Artifact
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Bing, Yandex, Seznam i Naver dostają adresy nowych wpisów od razu, zamiast czekać na odczyt mapy strony
      - name: Notify IndexNow
        if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        run: |
          curl -sS -f -m 30 -H 'Content-Type: application/json; charset=utf-8' --data "$BODY" https://api.indexnow.org/indexnow
        env:
          BODY: ${{ needs.build.outputs.indexnow }}
