name: Deploy static content to Pages

on:
  push:
    branches:
      - main
      - master
  # Odświeżanie danych publicznych i nowe wpisy z gałęzi blog repo danych (best-effort: GitHub może opóźniać lub pomijać
  # przebiegi z harmonogramu)
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Zgłoś do IndexNow wszystkie adresy z sitemap.xml'
        type: boolean
        default: false
      # Tylko właściciel repo (BLOG_RESEED niżej); przy BLOG_INTAKE = on. Jednorazowo przyjmuje wszystkie wpisy z gałęzi blog
      # bez dolnej granicy daty (seen = chwila buildu), także gdy opublikowany source.json jest nieczytelny albo utracony
      blog_reseed:
        description: 'Odtwórz rejestr wpisów bloga (wszystkie wpisy z gałęzi blog, tylko właściciel repo)'
        type: boolean
        default: false

# Uprawnienia tylko na poziomie jobów: build (który przetwarza wpisy z repo danych) tylko czyta, zapis do Pages ma deploy.
# Akcje przypięte do hashy commitów.
permissions: {}

concurrency:
  group: "pages"
  # Nie przerywaj trwającego wdrożenia (np. push nie może zostać anulowany przez przebieg z harmonogramu)
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite App
    runs-on: ubuntu-latest
    # Grupa pages nie przerywa trwających przebiegów: zawieszony krok blokowałby wszystkie następne wdrożenia
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Wpisy bloga: gałąź blog publicznego repo danych, czytana bez uwierzytelnienia jako niezaufana treść. Kroki gałęzi
      # działają tylko przy zmiennej repozytorium BLOG_INTAKE = on (wyłącznik; bez niej workflow jak przed ich dodaniem)
      BLOG_REPO: https://github.com/rdemb/hyperquant-data.git
      # Odtworzenie rejestru: ręczne uruchomienie z blog_reseed przez właściciela repo; actor i triggering_actor, bo przy
      # ponownym uruchomieniu przebiegu actor zostaje z pierwszego uruchomienia
      BLOG_RESEED: ${{ github.event_name == 'workflow_dispatch' && inputs.blog_reseed && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    outputs:
      indexnow: ${{ steps.indexnow.outputs.body }}
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Głowa gałęzi blog (pusto: gałęzi nie ma albo GitHub nie odpowiada) i opublikowany blog/source.json: sha gałęzi, sha
      # main i rejestr wpisów (known=false: pliku nie da się odczytać, wtedy bramka nie wdraża niczego). Przed setup-node
      # (Node runnera, skrypt bez zależności), żeby sprawdzenie trwało sekundy
      - name: Blog Branch Head
        id: blog
        if: vars.BLOG_INTAKE == 'on'
        continue-on-error: true
        run: |
          sha=$(GIT_TERMINAL_PROMPT=0 timeout 30 git ls-remote --heads "$BLOG_REPO" refs/heads/blog | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          node scripts/blog/intake.mjs published --save "$RUNNER_TEMP/published.json" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # Dane publiczne bez kluczy API → public/data/feeds/*.json (skrypt bez zależności, przed npm ci); błąd źródeł
      # nie blokuje wdrożenia po pushu
      - name: Fetch Public Data
        id: feeds
        run: node scripts/fetch-public-data.mjs
        continue-on-error: true

      # Przebieg z harmonogramu wdraża tylko nowe dane; przy włączonej gałęzi blog także nowy stan gałęzi albo main inny niż
      # w opublikowanym source.json (pominięte wdrożenie po pushu powtarza się samo). Przy włączonej gałęzi i nieczytelnym
      # source.json nic nie jest wdrażane: bez rejestru stare wpisy z gałęzi wyglądałyby na nowe (wyjątek: odtworzenie rejestru)
      - name: Decide Deploy
        id: gate
        run: |
          if [ "$INTAKE" = on ] && [ "$KNOWN" != true ] && [ "$BLOG_RESEED" != true ]; then
            echo "Gałąź blog włączona, a blog/source.json strony nieczytelny: bez wdrożenia"
          elif [ "$EVENT" != schedule ] || [ "$CHANGED" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$INTAKE" = on ] && [ -n "$BLOG_SHA" ] && [ "$BLOG_SHA" != "$PUBLISHED" ]; then
            echo "Gałąź blog: ${PUBLISHED:-brak} → $BLOG_SHA"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$INTAKE" = on ] && [ "$MAIN_SHA" != "$PUBLISHED_MAIN" ]; then
            echo "Main: ${PUBLISHED_MAIN:-brak} na stronie, głowa $MAIN_SHA"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dane bez zmian albo pobranie nie powiodło się: bez wdrożenia"
          fi
        env:
          INTAKE: ${{ vars.BLOG_INTAKE }}
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.feeds.outputs.changed }}
          MAIN_SHA: ${{ github.sha }}
          BLOG_SHA: ${{ steps.blog.outputs.sha }}
          PUBLISHED: ${{ steps.blog.outputs.published }}
          PUBLISHED_MAIN: ${{ steps.blog.outputs.main }}
          KNOWN: ${{ steps.blog.outputs.known }}

      # Filtr treści przed npm ci i bez zależności: pełny klon gałęzi blog (limit 120 s) do katalogu tymczasowego runnera
      # (poza repo, więc testy i kompilator go nie widzą; bez poświadczeń), do content/blog trafiają tylko pliki wpisów, które
      # przeszły filtr (nowy wpis: date w oknie chwili buildu wg rejestru z source.json); wpis z main ma pierwszeństwo.
      # Gałęzi nie ma albo klon się nie udał: build z samego main, w source.json poprzedni sha. Błąd filtra też nie zatrzymuje
      # strony: content/blog wraca do stanu z main
      - name: Blog Intake
        if: vars.BLOG_INTAKE == 'on' && steps.gate.outputs.deploy == 'true'
        run: |
          src=
          reseed=
          if [ "$BLOG_RESEED" = true ]; then reseed=--reseed; fi
          if [ -n "$BLOG_SHA" ] && GIT_TERMINAL_PROMPT=0 timeout 120 git clone -q --no-tags --single-branch --branch blog "$BLOG_REPO" "$RUNNER_TEMP/blog"; then
            src="$RUNNER_TEMP/blog"
          fi
          if [ -n "$reseed" ] && [ -z "$src" ]; then
            echo "::error::Odtworzenie rejestru wymaga klonu gałęzi blog; klon się nie udał albo gałęzi nie ma. Bez wdrożenia."
            exit 1
          fi
          if ! node scripts/blog/intake.mjs filter $reseed --src "$src" --dest content/blog --published "$RUNNER_TEMP/published.json" --out "$RUNNER_TEMP/blog-intake.json"; then
            echo "::warning::Filtr gałęzi blog zawiódł: build tylko z wpisów main"
            git checkout -- content/blog && git clean -fdq -- content/blog
            node scripts/blog/intake.mjs filter $reseed --src "" --dest content/blog --published "$RUNNER_TEMP/published.json" --out "$RUNNER_TEMP/blog-intake.json"
          fi
          echo "BLOG_INTAKE=$RUNNER_TEMP/blog-intake.json" >> "$GITHUB_ENV"
        env:
          BLOG_SHA: ${{ steps.blog.outputs.sha }}

      - name: Install Dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci --legacy-peer-deps

      - name: Type Check
        if: steps.gate.outputs.deploy == 'true'
        run: npm run lint

      - name: Run Tests
        if: steps.gate.outputs.deploy == 'true'
        run: npm test

      # Bundle paczki MCP i test dymny przez prawdziwe stdio (initialize + tools/list, bez sieci): czysty stdout i 10 narzędzi
      - name: Build MCP Bundle
        if: steps.gate.outputs.deploy == 'true'
        run: npm run mcp:build

      - name: MCP Stdio Smoke Test
        if: steps.gate.outputs.deploy == 'true'
        run: node mcp/scripts/stdio-smoke.mjs mcp/dist/hyperquant-mcp.mjs

      # Blog czyta raport filtra z BLOG_INTAKE (wpisy z gałęzi blog: historia z repo danych, pominięte w blog/source.json)
      - name: Build Production Assets
        if: steps.gate.outputs.deploy == 'true'
        run: npm run build
        env:
          # Publiczny adres danych skanera (repo rdemb/hyperquant-data) — zmienna repozytorium, pusta = panel mapy likwidacji czeka
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}

      # Paczka MCPB dla Claude Desktop (instalacja dwuklikiem, zakładka Agenci AI) z bundla zbudowanego i sprawdzonego
      # wyżej → dist/agents/hyperquant.mcpb; po buildzie strony, bo vite czyści dist
      - name: Pack MCPB Bundle
        if: steps.gate.outputs.deploy == 'true'
        run: npm run mcp:mcpb

      # Nowe i zmienione wpisy bloga → zgłoszenie IndexNow po wdrożeniu (pusto = nic do zgłoszenia): z pusha diff względem
      # poprzedniej głowy main (lista plików w commitach zdarzenia push jest pusta), z gałęzi blog diff w jej klonie od sha
      # opublikowanego na stronie (historia przepisana: bez zgłoszenia), ręcznie cała mapa strony
      - name: List New Blog Posts For IndexNow
        id: indexnow
        if: github.event_name == 'push' || inputs.indexnow_all || (steps.gate.outputs.deploy == 'true' && steps.blog.outputs.sha != '' && steps.blog.outputs.sha != steps.blog.outputs.published)
        continue-on-error: true
        run: |
          if [ "$ALL" = true ]; then
            node scripts/blog/indexnow.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            if [ "$EVENT" = push ]; then
              git fetch --no-tags --depth=1 origin "$BEFORE"
              git diff --name-only --diff-filter=AM "$BEFORE" HEAD
            fi
            # Bez znanego sha strony (nie odpowiedziała) nie wiadomo, co jest nowe: bez zgłoszenia wpisów z gałęzi
            if [ -d "$RUNNER_TEMP/blog/.git" ] && [ "$KNOWN" = true ]; then
              node scripts/blog/intake.mjs changed --src "$RUNNER_TEMP/blog" --prev "$PUBLISHED"
            fi
          } | node scripts/blog/indexnow.mjs >> "$GITHUB_OUTPUT"
        env:
          ALL: ${{ inputs.indexnow_all }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PUBLISHED: ${{ steps.blog.outputs.published }}
          KNOWN: ${{ steps.blog.outputs.known }}

      - name: Upload GitHub Pages Artifact
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      # Bing, Yandex, Seznam i Naver dostają adresy nowych wpisów od razu, zamiast czekać na odczyt mapy strony
      - name: Notify IndexNow
        if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        run: |
          curl -sS -f -m 30 -H 'Content-Type: application/json; charset=utf-8' --data "$BODY" https://api.indexnow.org/indexnow
        env:
          BODY: ${{ needs.build.outputs.indexnow }}
