name: Deploy static content to Pages

on:
  push:
    branches:
      - main
      - master
  # Odświeżanie danych publicznych (best-effort: GitHub może opóźniać lub pomijać przebiegi z harmonogramu)
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Nie przerywaj trwającego wdrożenia (np. push nie może zostać anulowany przez przebieg z harmonogramu)
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite App
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.body }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Type Check
        run: npm run lint

      - name: Run Tests
        run: npm test

      # Dane publiczne bez kluczy API → public/data/feeds/*.json; błąd źródeł nie blokuje wdrożenia
      - name: Fetch Public Data
        run: node scripts/fetch-public-data.mjs
        continue-on-error: true

      - name: Build Production Assets
        run: npm run build
        env:
          # Publiczny adres danych skanera (repo rdemb/hyperquant-data) — zmienna repozytorium, pusta = panel mapy likwidacji czeka
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}

      # Nowe i zmienione wpisy bloga z tego pusha → zgłoszenie IndexNow po wdrożeniu (pusto = nic do zgłoszenia)
      - name: List New Blog Posts For IndexNow
        id: indexnow
        if: github.event_name == 'push'
        continue-on-error: true
        run: node scripts/blog/indexnow.mjs >> "$GITHUB_OUTPUT"
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Bing, Yandex, Seznam i Naver dostają adresy nowych wpisów od razu, zamiast czekać na odczyt mapy strony
      - name: Notify IndexNow
        if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        run: |
          curl -sS -f -m 30 -H 'Content-Type: application/json; charset=utf-8' --data "$BODY" https://api.indexnow.org/indexnow
        env:
          BODY: ${{ needs.build.outputs.indexnow }}
