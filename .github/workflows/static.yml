name: Deploy static content to Pages

on:
  push:
    branches:
      - main
      - master
  # Odświeżanie danych publicznych (best-effort: GitHub może opóźniać lub pomijać przebiegi z harmonogramu)
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Nie przerywaj trwającego wdrożenia (np. push nie może zostać anulowany przez przebieg z harmonogramu)
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Type Check
        run: npm run lint

      - name: Run Tests
        run: npm test

      # Dane publiczne bez kluczy API → public/data/feeds/*.json; błąd źródeł nie blokuje wdrożenia
      - name: Fetch Public Data
        run: node scripts/fetch-public-data.mjs
        continue-on-error: true

      - name: Build Production Assets
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
