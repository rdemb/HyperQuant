name: Deploy alerts mailbox (Cloudflare)

# Skrzynka alarmów dla powiadomień 24/7 (workers/alerts): Worker + baza D1 na koncie Cloudflare właściciela.
# Bez sekretu CLOUDFLARE_API_TOKEN przebieg kończy się bez wdrożenia (CLOUDFLARE_ACCOUNT_ID opcjonalny przy tokenie jednego konta).
on:
  push:
    branches:
      - main
    paths:
      - 'workers/alerts/**'
      - 'src/utils/alertRules.ts'
      - 'src/utils/alertsServer.ts'
      - '.github/workflows/alerts-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    env:
      TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Identyfikator konta z sekretu albo zmiennej; bez nich odczytywany z tokenu (token z dostępem do jednego konta)
      ACCOUNT_ID_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # Publiczny adres repo danych: skrzynka czyta z niego klucz publiczny serwera powiadomień
      DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      WRANGLER: npx --yes wrangler@4.150.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check Configuration
        id: ready
        run: |
          if [ -z "$TOKEN_SET" ] || [ -z "$DATA_BASE_URL" ]; then
            echo "::notice::Brak sekretu CLOUDFLARE_API_TOKEN albo zmiennej DATA_BASE_URL: skrzynka nie jest wdrażana."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sekret wklejony ze spacją, nowym wierszem, z przykładowym poleceniem „curl … Bearer …” z panelu Cloudflare
          # albo razem z identyfikatorem konta: token i konto wyłuskane z treści (w dzienniku tylko długości wierszy)
          parsed="$(printf '%s' "$TOKEN_SET" | node -e 'const s=require("fs").readFileSync(0,"utf8");const L=s.split(/\r?\n/).map((l)=>l.trim()).filter(Boolean);const b=s.match(/Bearer\s+([^\s"\x27]+)/);const id=L.find((l)=>/^[0-9a-f]{32}$/.test(l))??(s.match(/accounts\/([0-9a-f]{32})/)??[])[1]??"";const c=L.filter((l)=>l!==id&&/^[^\s"\x27]{20,}$/.test(l));const t=b?b[1]:c.length===1?c[0]:"";if(!t)console.error(L.map((l,i)=>`wiersz ${i+1}: ${l.length} znaków${/\s/.test(l)?", ze spacjami":""}${/curl|http/i.test(l)?", polecenie":""}`).join("; "));process.stdout.write(`${t}\n${id}\n`)')"
          { read -r token; read -r guessed; } <<< "$parsed" || true
          if [ -z "$token" ]; then
            echo "::error::Sekret CLOUDFLARE_API_TOKEN nie zawiera rozpoznawalnego tokenu API. Wklej sam token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          account="$(printf '%s' "$ACCOUNT_ID_SET" | tr -d '[:space:]')"
          account="${account:-$guessed}"
          if [ -z "$account" ]; then
            account="$(curl -fsS -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/accounts?per_page=5' | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")).result??[];process.stdout.write(r.length===1?r[0].id:"")')" || account=""
          fi
          if [ -z "$account" ]; then
            echo "::error::Nie znam konta Cloudflare: ustaw sekret CLOUDFLARE_ACCOUNT_ID albo token z dostępem do jednego konta."
            exit 1
          fi
          echo "::add-mask::$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Konto bez adresu *.workers.dev dostaje go przy pierwszym wdrożeniu (pierwsza wolna nazwa z listy)
      - name: Ensure workers.dev Subdomain
        if: steps.ready.outputs.ok == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub="$(curl -fsS -H "$auth" "$api" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(r.result?.subdomain??"")')" || sub=""
          if [ -z "$sub" ]; then
            for name in hyperquant hyperquant-desk hyperquant-alerts; do
              if curl -fsS -X PUT -H "$auth" -H 'content-type: application/json' --data "{\"subdomain\":\"$name\"}" "$api" > /dev/null; then
                sub="$name"
                break
              fi
            done
          fi
          test -n "$sub"
          echo "Skrzynka: https://hyperquant-alerts.$sub.workers.dev"

      # Baza tworzona przy pierwszym wdrożeniu; schemat tylko z IF NOT EXISTS, więc każde wdrożenie może go wykonać
      - name: Prepare D1 Database
        if: steps.ready.outputs.ok == 'true'
        working-directory: workers/alerts
        run: |
          find_id() {
            $WRANGLER d1 list --json | node -e 'const s=require("fs").readFileSync(0,"utf8");const l=JSON.parse(s.slice(s.indexOf("[")));const d=l.find((x)=>x.name==="hyperquant-alerts");process.stdout.write(d?d.uuid:"")'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            $WRANGLER d1 create hyperquant-alerts
            id="$(find_id)"
          fi
          test -n "$id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          $WRANGLER d1 execute hyperquant-alerts --remote --file schema.sql -y

      - name: Deploy Worker
        if: steps.ready.outputs.ok == 'true'
        working-directory: workers/alerts
        run: $WRANGLER deploy --var "DATA_BASE_URL:$DATA_BASE_URL"
