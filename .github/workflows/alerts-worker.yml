name: Deploy alerts mailbox (Cloudflare)

# Skrzynka alarmów dla powiadomień 24/7 (workers/alerts): Worker + baza D1 na koncie Cloudflare właściciela.
# Bez sekretów CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID przebieg kończy się bez wdrożenia.
on:
  push:
    branches:
      - main
    paths:
      - 'workers/alerts/**'
      - 'src/utils/alertRules.ts'
      - 'src/utils/alertsServer.ts'
      - '.github/workflows/alerts-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Publiczny adres repo danych: skrzynka czyta z niego klucz publiczny serwera powiadomień
      DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      WRANGLER: npx --yes wrangler@4.150.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check Configuration
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$DATA_BASE_URL" ]; then
            echo "::notice::Brak sekretów CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID albo zmiennej DATA_BASE_URL: skrzynka nie jest wdrażana."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Konto bez adresu *.workers.dev dostaje go przy pierwszym wdrożeniu (pierwsza wolna nazwa z listy)
      - name: Ensure workers.dev Subdomain
        if: steps.ready.outputs.ok == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub="$(curl -fsS -H "$auth" "$api" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(r.result?.subdomain??"")')" || sub=""
          if [ -z "$sub" ]; then
            for name in hyperquant hyperquant-desk hyperquant-alerts; do
              if curl -fsS -X PUT -H "$auth" -H 'content-type: application/json' --data "{\"subdomain\":\"$name\"}" "$api" > /dev/null; then
                sub="$name"
                break
              fi
            done
          fi
          test -n "$sub"
          echo "Skrzynka: https://hyperquant-alerts.$sub.workers.dev"

      # Baza tworzona przy pierwszym wdrożeniu; schemat tylko z IF NOT EXISTS, więc każde wdrożenie może go wykonać
      - name: Prepare D1 Database
        if: steps.ready.outputs.ok == 'true'
        working-directory: workers/alerts
        run: |
          find_id() {
            $WRANGLER d1 list --json | node -e 'const s=require("fs").readFileSync(0,"utf8");const l=JSON.parse(s.slice(s.indexOf("[")));const d=l.find((x)=>x.name==="hyperquant-alerts");process.stdout.write(d?d.uuid:"")'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            $WRANGLER d1 create hyperquant-alerts
            id="$(find_id)"
          fi
          test -n "$id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          $WRANGLER d1 execute hyperquant-alerts --remote --file schema.sql -y

      - name: Deploy Worker
        if: steps.ready.outputs.ok == 'true'
        working-directory: workers/alerts
        run: $WRANGLER deploy --var "DATA_BASE_URL:$DATA_BASE_URL"
