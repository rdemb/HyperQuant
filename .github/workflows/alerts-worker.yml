name: Deploy alerts mailbox (Cloudflare)

# Skrzynka alarmów dla powiadomień 24/7 (workers/alerts): Worker + baza D1 na koncie Cloudflare właściciela.
# Bez sekretu CLOUDFLARE_API_TOKEN przebieg kończy się bez wdrożenia (CLOUDFLARE_ACCOUNT_ID opcjonalny przy tokenie jednego konta).
on:
  push:
    branches:
      - main
    paths:
      - 'workers/alerts/**'
      - 'src/utils/alertRules.ts'
      - 'src/utils/alertsServer.ts'
      - '.github/workflows/alerts-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    env:
      TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Identyfikator konta z sekretu albo zmiennej; bez nich odczytywany z tokenu (token z dostępem do jednego konta)
      ACCOUNT_ID_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # Publiczny adres repo danych: skrzynka czyta z niego klucz publiczny serwera powiadomień
      DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      WRANGLER: npx --yes wrangler@4.150.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check Configuration
        id: ready
        run: |
          if [ -z "$TOKEN_SET" ] || [ -z "$DATA_BASE_URL" ]; then
            echo "::notice::Brak sekretu CLOUDFLARE_API_TOKEN albo zmiennej DATA_BASE_URL: skrzynka nie jest wdrażana."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Token bez spacji i nowych wierszy z kopiowania; inna treść sekretu to błąd (w dzienniku tylko długości wierszy)
          token="$(printf '%s' "$TOKEN_SET" | tr -d '[:space:]')"
          if [ "$(printf '%s' "$TOKEN_SET" | wc -w)" -ne 1 ]; then
            echo "::error::Sekret CLOUDFLARE_API_TOKEN to nie sam token (wiersze: $(printf '%s\n' "$TOKEN_SET" | awk '{ printf "%d znaków, %d słów; ", length($0), NF }')). Wklej sam token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          account="$(printf '%s' "$ACCOUNT_ID_SET" | tr -d '[:space:]')"
          case "$token" in
            cfk_*) echo "::error::Sekret CLOUDFLARE_API_TOKEN to Global API Key, a potrzebny jest token API (Create Token)."; exit 1 ;;
            cfat_*) kind="token konta" ;;
            *) kind="token użytkownika" ;;
          esac
          if [ "$kind" = "token konta" ] && [ -z "$account" ]; then
            echo "::error::Token konta (cfat_) wymaga sekretu CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          if [ "$kind" = "token konta" ]; then verify="accounts/$account/tokens/verify"; else verify="user/tokens/verify"; fi
          # Stan tokenu w Cloudflare zamiast samego „403” przy pierwszym zapytaniu
          status="$(curl -sS -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/$verify" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")||"{}");console.error(`${process.argv[1]}: ${r.result?.status??"nieznany"}${(r.errors??[]).map((e)=>`, błąd ${e.code}: ${e.message}`).join("")}`);process.stdout.write(r.result?.status??"")' "$kind")" || status=""
          if [ "$status" != "active" ]; then
            echo "::error::Cloudflare nie przyjmuje tego tokenu. Skopiuj go jeszcze raz w całości (po „Roll” stary przestaje działać)."
            exit 1
          fi
          # Token użytkownika z dostępem do jednego konta wystarcza, by odczytać identyfikator konta
          if [ -z "$account" ]; then
            account="$(curl -fsS -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/accounts?per_page=5' | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")).result??[];process.stdout.write(r.length===1?r[0].id:"")')" || account=""
          fi
          if [ -z "$account" ]; then
            echo "::error::Nie znam konta Cloudflare: ustaw sekret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "::add-mask::$account"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Konto bez adresu *.workers.dev dostaje go przy pierwszym wdrożeniu (pierwsza wolna nazwa z listy)
      - name: Ensure workers.dev Subdomain
        if: steps.ready.outputs.ok == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub="$(curl -fsS -H "$auth" "$api" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(r.result?.subdomain??"")')" || sub=""
          if [ -z "$sub" ]; then
            for name in hyperquant hyperquant-desk hyperquant-alerts; do
              if curl -fsS -X PUT -H "$auth" -H 'content-type: application/json' --data "{\"subdomain\":\"$name\"}" "$api" > /dev/null; then
                sub="$name"
                break
              fi
            done
          fi
          test -n "$sub"
          echo "Skrzynka: https://hyperquant-alerts.$sub.workers.dev"

      # Baza tworzona przy pierwszym wdrożeniu; schemat tylko z IF NOT EXISTS, więc każde wdrożenie może go wykonać
      - name: Prepare D1 Database
        if: steps.ready.outputs.ok == 'true'
        working-directory: workers/alerts
        run: |
          find_id() {
            $WRANGLER d1 list --json | node -e 'const s=require("fs").readFileSync(0,"utf8");const l=JSON.parse(s.slice(s.indexOf("[")));const d=l.find((x)=>x.name==="hyperquant-alerts");process.stdout.write(d?d.uuid:"")'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            $WRANGLER d1 create hyperquant-alerts
            id="$(find_id)"
          fi
          test -n "$id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          $WRANGLER d1 execute hyperquant-alerts --remote --file schema.sql -y

      - name: Deploy Worker
        if: steps.ready.outputs.ok == 'true'
        working-directory: workers/alerts
        run: $WRANGLER deploy --var "DATA_BASE_URL:$DATA_BASE_URL"
