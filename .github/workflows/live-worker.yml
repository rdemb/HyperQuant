name: Deploy live relay (Cloudflare)

# Przekaźnik na żywo (workers/live): Worker + Durable Object z gorącym ogonem nagrania skanera, na koncie Cloudflare
# właściciela (to samo konto co skrzynka alarmów). Bez sekretów CLOUDFLARE_API_TOKEN i LIVE_PUSH_TOKEN przebieg kończy się
# bez wdrożenia. Ten sam LIVE_PUSH_TOKEN trafia do HQ_LIVE_TOKEN skanera; adres Workera do zmiennej repozytorium LIVE_URL.
on:
  push:
    branches:
      - main
    paths:
      - 'workers/live/**'
      - 'src/utils/tailFrames.ts'
      - '.github/workflows/live-worker.yml'
      - '.github/actions/cloudflare-auth/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    env:
      TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Identyfikator konta z sekretu albo zmiennej; bez nich odczytywany z tokenu (token z dostępem do jednego konta)
      ACCOUNT_ID_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      LIVE_PUSH_TOKEN: ${{ secrets.LIVE_PUSH_TOKEN }}
      LIVE_URL_SET: ${{ vars.LIVE_URL }}
      WRANGLER: npx --yes wrangler@4.150.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check Configuration
        id: ready
        run: |
          if [ -z "$TOKEN_SET" ] || [ -z "$LIVE_PUSH_TOKEN" ]; then
            echo "::notice::Brak sekretu CLOUDFLARE_API_TOKEN albo LIVE_PUSH_TOKEN: przekaźnik nie jest wdrażany."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#LIVE_PUSH_TOKEN}" -lt 32 ]; then
            echo "::error::LIVE_PUSH_TOKEN musi mieć co najmniej 32 znaki (np. openssl rand -hex 32)."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Cloudflare Auth
        if: steps.ready.outputs.ok == 'true'
        uses: ./.github/actions/cloudflare-auth
        with:
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account: ${{ env.ACCOUNT_ID_SET }}

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        working-directory: workers/live
        run: |
          $WRANGLER deploy
          # Sekret Workera z sekretu repozytorium (stdin — nie trafia do dziennika ani linii polecenia)
          printf '%s' "$LIVE_PUSH_TOKEN" | $WRANGLER secret put LIVE_PUSH_TOKEN

      # Adres przekaźnika w podsumowaniu przebiegu: do zmiennej LIVE_URL i HQ_LIVE_URL skanera. Nowy adres potrzebuje
      # chwili na certyfikat, stąd do 3 minut prób
      - name: Check Worker
        if: steps.ready.outputs.ok == 'true'
        run: |
          sub="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(r.result?.subdomain??"")')" || sub=""
          if [ -z "$sub" ]; then
            echo "::error::Konto nie ma adresu *.workers.dev: uruchom najpierw „Deploy alerts mailbox (Cloudflare)”, które go zakłada."
            exit 1
          fi
          url="https://hyperquant-live.$sub.workers.dev"
          curl -fsS -o /dev/null -X OPTIONS --retry 30 --retry-delay 6 --retry-all-errors "$url/v1/tail/BTC"
          echo "Przekaźnik: $url"
          {
            echo "### Przekaźnik na żywo działa"
            echo
            echo "Adres: \`$url\`"
            echo
            echo "- zmienna repozytorium **LIVE_URL** (Settings → Secrets and variables → Actions → Variables) — build strony"
            echo "- \`HQ_LIVE_URL\` w \`/etc/hyperquant/scanner.env\` na serwerze skanera"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${LIVE_URL_SET%/}" != "$url" ]; then
            echo "::warning::Zmienna repozytorium LIVE_URL (\"$LIVE_URL_SET\") różni się od adresu przekaźnika $url — ustaw ją, żeby strona pobierała ogon."
          fi
