<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://hyperquant.tech/">
  <title>HyperQuant</title>
  <script>
    /* Dawny osobny terminal jest częścią aplikacji pod głównym adresem: Dziś, Przed sesją, W sesji, Po sesji.
       Zakładki i linki (#dzis, #przed, #sesja?m=…, #po, #ustawienia) przechodzą do tych samych miejsc z rynkiem i językiem. */
    (function () {
      var map = { dzis: 'dzis', przed: 'before', sesja: 'charts', po: 'after', ustawienia: 'dzis' };
      var raw = location.hash.replace(/^#/, '');
      var q = raw.indexOf('?');
      var id = q < 0 ? raw : raw.slice(0, q);
      var params = new URLSearchParams(q < 0 ? '' : raw.slice(q + 1));
      var view = Object.prototype.hasOwnProperty.call(map, id) ? map[id] : 'dzis';
      var target = new URL('../', location.href);
      var lang = new URLSearchParams(location.search).get('lang');
      if (lang === 'pl' || lang === 'en') target.searchParams.set('lang', lang);
      var m = params.get('m');
      target.hash = view + (m && view !== 'dzis' ? '?m=' + encodeURIComponent(m) : '');
      location.replace(target.href);
    })();
  </script>
  <style>
    html { color-scheme: dark; background: #0b0a12; color: #f0edf7; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    a { color: #cfea5b; }
  </style>
</head>
<body>
  <p>Terminal HyperQuant jest teraz częścią aplikacji. <a href="../?lang=pl#dzis">Otwórz Dziś</a> · <a href="../?lang=en#dzis" lang="en">Open Today</a></p>
</body>
</html>
