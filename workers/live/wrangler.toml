# Przekaźnik na żywo HyperQuant (gorący ogon nagrania skanera). Wdrażany przez .github/workflows/live-worker.yml.
name = "hyperquant-live"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Jeden obiekt (`tails`): ostatni ogon każdego rynku i pliki skanera w pamięci (bez zapisu — skaner wysyła nowe co kilka
# sekund) oraz gniazda przeglądarek kanału na żywo w trybie hibernacji
[[durable_objects.bindings]]
name = "TAIL"
class_name = "LiveTail"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveTail"]
