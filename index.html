    <script>
      // Theme before the first paint (no flash): the saved choice or the system setting (src/theme.ts)
      try {
        var t = localStorage.getItem('hq.theme');
        var p = localStorage.getItem('hqp.theme');
        if (t !== 'light' && t !== 'dark') t = p === 'paper' ? 'light' : p === 'deep' ? 'dark' : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (localStorage.getItem('hqp.motion') === 'reduced') document.documentElement.dataset.motion = 'reduced';
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F2F1F6');
      } catch (e) {}
    </script>

    <style>
      /* First paint before the home page or the app loads: theme background instead of a white page */
      html { background: #0b0a12; }
      html[data-theme='light'] { background: #f2f1f6; }
      /* HyperQuant page transition: the next page opens from the waterline */
      @view-transition { navigation: auto; }
      ::view-transition-old(root) { animation: hq-vt-out .38s cubic-bezier(.64,0,.78,0) both; }
      ::view-transition-new(root) { animation: hq-vt-in .7s cubic-bezier(.83,0,.17,1) both; }
      @keyframes hq-vt-out { to { opacity: 0; transform: scale(.985); } }
      @keyframes hq-vt-in { from { clip-path: inset(49.6% 0 49.6% 0); } to { clip-path: inset(0 0 0 0); } }
      html[data-motion='reduced']::view-transition-old(root), html[data-motion='reduced']::view-transition-new(root) { animation: none; }
      @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
      .hq-start-recovery { --start-lume: #cfea5b; --start-page: #0b0a12; box-sizing: border-box; max-width: 32rem; margin: 12vh auto; padding: 1.5rem; color: #edeef0; font: 1rem/1.6 system-ui, sans-serif; }
      html[data-theme='light'] .hq-start-recovery { --start-lume: #3a4500; --start-page: #f2f1f6; color: #181525; }
      .hq-start-recovery a { color: var(--start-lume); }
      .hq-start-options { animation: hq-start-options 0s 4s both; }
      @keyframes hq-start-options { from { visibility: hidden; } to { visibility: visible; } }
      html[data-motion='reduced'] .hq-start-options { animation: none; }
      @media (prefers-reduced-motion: reduce) { .hq-start-options { animation: none; } }
    </style>
