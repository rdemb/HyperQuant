<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/fonts/fonts.css">
    <title>HyperQuant · Stanowisko</title>
    <style>
      /* HyperQuant page transition: the next page opens from the waterline */
      @view-transition { navigation: auto; }
      ::view-transition-old(root) { animation: hq-vt-out .38s cubic-bezier(.64,0,.78,0) both; }
      ::view-transition-new(root) { animation: hq-vt-in .7s cubic-bezier(.83,0,.17,1) both; }
      @keyframes hq-vt-out { to { opacity: 0; transform: scale(.985); } }
      @keyframes hq-vt-in { from { clip-path: inset(49.6% 0 49.6% 0); } to { clip-path: inset(0 0 0 0); } }
      @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
    </style>
  </head>
  <body>
    <div id="workbench-root"></div>
    <script type="module" src="../src/workbench/main.tsx"></script>
  </body>
</html>
